{% extends "dashboard/main.html" %}
{% load static %}
{% block content %}
{% load crispy_forms_tags %}
    <div class="container">
      <div class="row mt-5 pt-5 justify-content-center">
        <div class="col-xl-4 col-lg-5 col-md-7 mx-auto">
          <div class="card z-index-0">
            <div class="card-header text-center pt-4">
              <h5>Create {{form_item}}</h5>
            </div>  
            <div class="card-body">
              <form method="POST">
                {% csrf_token %}
                {{ form|crispy }}
                <div class="text-center">
                  <button type="submit" class="btn bg-gradient-primary w-100 my-4 mb-2">Create Account</button>
                </div>
              </form>
            </div>
            </div>
        </div>
      </div>
    </div>

    <script>
  document.addEventListener('DOMContentLoaded', function() {
    const typeField = document.getElementById('id_type');
    const secondaryAccountField = document.getElementById('id_account_id_secondary');
    const secondaryAccountContainer = secondaryAccountField.closest('.form-group') || secondaryAccountField.parentElement;

    function toggleSecondaryAccount() {
        if (typeField.value === 'Transfer') {
            secondaryAccountContainer.style.display = 'block';
        } else {
            secondaryAccountContainer.style.display = 'none';
            secondaryAccountField.value = '';
        }
    }

    toggleSecondaryAccount();
    typeField.addEventListener('change', toggleSecondaryAccount);
});
</script>
{% endblock content %}
